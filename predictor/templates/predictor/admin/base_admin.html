<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>{% block title %}CardioCare Admin{% endblock %}</title>
<style>
:root{--bg:#f8fafc;--card:#fff;--text:#0f172a;--muted:#64748b;--blue:#2563eb;--blue2:#1d4ed8;--border:#e2e8f0;--red:#dc2626;--green:#16a34a;--radius:12px}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text)}
.topbar{background:#fff;border-bottom:1px solid var(--border);padding:1rem 1.5rem;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:3}.brand{font-size:1.2rem;font-weight:800;text-decoration:none;color:var(--text)}.brand span{color:var(--blue)}.topbar nav a{margin-left:1rem;color:var(--muted);text-decoration:none;font-size:.9rem}.topbar nav a:hover{color:var(--blue)}
.shell{max-width:1180px;margin:0 auto;padding:2rem 1.5rem}.admin-nav{display:flex;gap:.65rem;flex-wrap:wrap;margin-bottom:1.5rem}.admin-nav a{padding:.65rem .9rem;border:1px solid var(--border);border-radius:8px;background:#fff;color:var(--text);text-decoration:none;font-size:.9rem}.admin-nav a:hover{border-color:var(--blue);color:var(--blue)}
.page-head{display:flex;justify-content:space-between;align-items:center;gap:1rem;margin-bottom:1rem}.page-head h1{font-size:1.7rem;margin:0}.muted{color:var(--muted)}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:1.25rem;box-shadow:0 4px 10px rgba(15,23,42,.03)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;margin-bottom:1.5rem}.metric strong{font-size:1.8rem;display:block}.metric span{color:var(--muted);font-size:.85rem}
table{width:100%;border-collapse:collapse;background:#fff}th,td{text-align:left;padding:.8rem;border-bottom:1px solid var(--border);font-size:.88rem;vertical-align:middle}th{font-size:.76rem;text-transform:uppercase;color:var(--muted);letter-spacing:.04em}.table-wrap{overflow:auto;border:1px solid var(--border);border-radius:var(--radius);background:#fff}.badge{display:inline-block;border-radius:999px;padding:.25rem .55rem;font-size:.74rem;font-weight:700}.badge-blue{background:#eff6ff;color:#1d4ed8}.badge-green{background:#f0fdf4;color:#15803d}.badge-gray{background:#f1f5f9;color:#475569}.badge-red{background:#fef2f2;color:#b91c1c}
.btn{display:inline-block;border:0;border-radius:7px;padding:.55rem .75rem;text-decoration:none;cursor:pointer;font-weight:650;font-size:.82rem}.btn-primary{background:var(--blue);color:#fff}.btn-primary:hover{background:var(--blue2)}.btn-light{background:#fff;color:var(--text);border:1px solid var(--border)}.btn-danger{background:#fef2f2;color:#b91c1c;border:1px solid #fecaca}.actions{display:flex;gap:.4rem;align-items:center}.actions form{margin:0}.message{padding:.8rem 1rem;border:1px solid #bfdbfe;background:#eff6ff;color:#1e40af;border-radius:8px;margin-bottom:1rem}
.form-card{max-width:720px}.form-row{margin-bottom:1rem}.form-row label{display:block;font-weight:700;font-size:.86rem;margin-bottom:.35rem}.form-row input{width:100%;padding:.7rem .8rem;border:1px solid var(--border);border-radius:8px}.checks label{display:flex;gap:.5rem;align-items:center;font-weight:600;margin:.55rem 0}.checks input{width:auto}.errors{color:#b91c1c;font-size:.8rem;margin-top:.3rem}.helptext{display:block;color:var(--muted);font-size:.78rem;margin-top:.3rem}ul.errorlist{color:#b91c1c;font-size:.8rem;padding-left:1.1rem}
@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:550px){.grid{grid-template-columns:1fr}.topbar{align-items:flex-start;gap:.5rem}.topbar nav a{margin-left:.5rem}.page-head{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<div class="topbar"><a class="brand" href="{% url 'system_admin_dashboard' %}">Cardio<span>Care</span> Admin</a><nav><a href="{% url 'predict_cardio' %}">User Site</a><a href="/admin/">Django Admin</a><a href="{% url 'logout' %}">Logout</a></nav></div>
<div class="shell">
<div class="admin-nav"><a href="{% url 'system_admin_dashboard' %}">Dashboard</a><a href="{% url 'system_admin_users' %}">Manage Users</a><a href="{% url 'system_admin_predictions' %}">Database Records</a></div>
{% if messages %}{% for message in messages %}<div class="message">{{ message }}</div>{% endfor %}{% endif %}
{% block content %}{% endblock %}
</div>
</body></html>
