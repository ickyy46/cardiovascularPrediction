<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | CardioCare</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #1f2937;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .card {
            width: 100%;
            max-width: 430px;
            background: #fff;
            border-radius: 18px;
            padding: 34px;
            box-shadow: 0 12px 35px rgba(0,0,0,.10);
        }
        h1 { margin: 0 0 8px; font-size: 30px; }
        .subtitle { margin: 0 0 26px; color: #6b7280; }
        label { display: block; margin: 14px 0 7px; font-weight: 600; }
        input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            font-size: 15px;
        }
        input:focus { outline: 2px solid #c7d2fe; border-color: #6366f1; }
        button {
            width: 100%;
            margin-top: 22px;
            padding: 13px;
            border: 0;
            border-radius: 10px;
            background: #4f46e5;
            color: #fff;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover { background: #4338ca; }
        .errorlist {
            color: #b91c1c;
            background: #fee2e2;
            border-radius: 8px;
            padding: 9px 11px;
            list-style: none;
            margin: 7px 0;
            font-size: 14px;
        }
        .footer { text-align: center; margin-top: 22px; color: #6b7280; }
        a { color: #4f46e5; text-decoration: none; font-weight: 600; }
        .brand { text-align: center; font-weight: 800; color: #4f46e5; margin-bottom: 18px; font-size: 20px; }
    </style>
</head>
<body>
    <div class="card">
        <div class="brand">CardioCare</div>
        <h1>Reset Password</h1>
        <p class="subtitle">Enter your email address to receive password reset instructions.</p>

        <form method="post" novalidate>
            {% csrf_token %}
            
            {% if form.email.errors %}
                <ul class="errorlist">
                    {% for error in form.email.errors %}
                        <li>{{ error }}</li>
                    {% endfor %}
                </ul>
            {% endif %}

            <label for="id_email">Email Address</label>
            <input type="email" name="email" id="id_email" placeholder="enter your registered email" required>

            <button type="submit">Send Reset Link</button>
        </form>

        <div class="footer">
            <a href="{% url 'login' %}">Back to Login</a>
        </div>
    </div>
</body>
</html>
